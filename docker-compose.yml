services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d directus']
      interval: 5s
      timeout: 5s
      retries: 20

  # Однократная подготовка Directus: системные таблицы, затем схема приложения.
  directus-init:
    image: directus/directus:12.5.0
    restart: 'no'
    environment: &directus-env
      KEY: ${DIRECTUS_KEY:-local-dev-key-change-me}
      SECRET: ${DIRECTUS_SECRET:-local-dev-secret-change-me-32-chars}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin12345}
    volumes:
      - ./app/snapshot-docker.json:/directus/seed-data/snapshot-docker.json:ro
    depends_on:
      database:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        node cli.js bootstrap
        node cli.js schema apply --yes /directus/seed-data/snapshot-docker.json

  directus:
    image: directus/directus:12.5.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:8055:8055'
    environment:
      <<: *directus-env
      PUBLIC_URL: http://localhost:8055
      CORS_ENABLED: 'true'
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./app/directus/uploads:/directus/uploads
      - ./app/directus/extensions:/directus/extensions
    depends_on:
      directus-init:
        condition: service_completed_successfully

  # Отдельный контейнер импортирует данные только после старта HTTP API.
  # Повторный запуск не должен создавать дубликатов.
  seed:
    image: node:22-alpine
    restart: 'no'
    working_dir: /seed
    environment:
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin12345}
    volumes:
      - ./app:/seed-data:ro
      - ./app/directus/seed/seed.mjs:/seed/seed.mjs:ro
    depends_on:
      directus:
        condition: service_started
    command: ['node', '/seed/seed.mjs']

volumes:
  pgdata:
