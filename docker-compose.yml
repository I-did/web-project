services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: "directus"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  directus:
    image: directus/directus:12
    ports:
      - "8055:8055"
    environment:
      KEY: "some-secret-key-for-docker"
      SECRET: "some-super-secret-string-that-is-long-enough-32"
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin12345"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:5173"
    volumes:
      - ./app/directus/uploads:/directus/uploads
      - ./app/directus/extensions:/directus/extensions
    depends_on:
      - database

volumes:
  pgdata:
