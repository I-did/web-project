name: CI

on:
  pull_request:

  paths:
    - 'app/frontend/**'
    - 'package.json'
    - 'package-lock.json'
    - '.prettierrc'
    - '.prettierignore'
    - '.github/workflows/ci.yml'

jobs:
  checks:
    name: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
